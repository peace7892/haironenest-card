<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤어원네스트 상담 카드</title>
<style>
  :root { --ink: #222; --muted: #777; --line: #ddd; --bg: #faf9f7; --accent: #8a5a3c; --accent-bg: #f3ebe4; --danger: #b3261e; --ok: #2e6b3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; color: var(--ink); background: var(--bg); }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; cursor: pointer; }
  header small { color: var(--muted); flex: 1; }
  main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 53px); }
  aside { background: #fff; border-right: 1px solid var(--line); padding: 16px; }
  section { padding: 20px 28px; max-width: 820px; }
  input, textarea, button { font: inherit; }
  input[type=text], textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  button.secondary { background: #fff; color: var(--accent); }
  button.link { background: none; border: none; color: var(--accent); padding: 0; text-decoration: underline; font-size: 14px; }
  button.small { padding: 5px 10px; font-size: 14px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .row > button { flex: 0 0 auto; }
  .list { list-style: none; margin: 12px 0 0; padding: 0; }
  .list li { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .list li:hover { background: var(--accent-bg); }
  .list li.active { background: var(--accent-bg); font-weight: 600; }
  .list li small { color: var(--muted); }
  .empty { color: var(--muted); padding: 12px; }
  .card-title { margin: 0 0 4px; font-size: 22px; display: flex; align-items: baseline; gap: 10px; }
  .card-title small { font-size: 14px; color: var(--muted); font-weight: normal; }
  .identity { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: 8px; align-items: end; margin: 8px 0 4px; }
  .referrer { color: var(--muted); font-size: 14px; margin: -2px 0 8px; }
  .profile { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0 20px; }
  .profile .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .profile .item b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .profile .item p { margin: 0; white-space: pre-wrap; line-height: 1.5; }
  .next-big { background: var(--accent-bg); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; }
  .next-big b { display: block; font-size: 13px; color: var(--accent); margin-bottom: 4px; }
  .next-big p { margin: 0; white-space: pre-wrap; line-height: 1.5; font-size: 17px; }
  .visit { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .visit .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .visit .field b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 8px 0 2px; }
  .visit .field p { margin: 0; white-space: pre-wrap; line-height: 1.6; }
  .history { margin: 10px 0 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; font-size: 14px; color: var(--muted); }
  .history p { margin: 4px 0; white-space: pre-wrap; }
  .msg { min-height: 22px; font-size: 14px; margin-top: 8px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  details summary { cursor: pointer; color: var(--muted); margin: 10px 0 6px; }
  .newform { display: grid; gap: 8px; }
  h3 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 24px 0 10px; }
  .today-item { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; display: grid; grid-template-columns: 30px 118px 1fr auto; gap: 12px; align-items: center; }
  .today-item:hover { background: var(--accent-bg); }
  .today-item .no { text-align: center; font-size: 19px; font-weight: 700; color: var(--muted); }
  .today-item .who { display: grid; gap: 3px; min-width: 0; }
  .today-item .name { font-weight: 600; font-size: 17px; }
  .today-item .sub { color: var(--muted); font-size: 14px; white-space: pre-wrap; }
  .today-item .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .today-item .status { font-size: 13px; padding: 3px 8px; border-radius: 999px; }
  .cycle { font-size: 14px; color: var(--accent); }
  .cycle b { font-weight: 700; }
  .cycle.big { background: var(--accent-bg); border-radius: 8px; padding: 8px 12px; margin: 8px 0 0; font-size: 15px; }
  .at { padding: 9px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 16px; color: var(--ink); cursor: pointer; }
  .at:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .today-item .when .at { width: 100%; }
  .add-today { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .add-today .row > .at { flex: 0 0 118px; }
  .add-today .hits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .add-today .hint { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .status.done { background: #e4f1e6; color: var(--ok); }
  .status.todo { background: #fbe9e7; color: var(--danger); }
  .tools { display: flex; gap: 8px; align-items: center; }
  button.danger { background: #fff; border-color: var(--danger); color: var(--danger); }
  button.link.danger { border: none; background: none; color: var(--danger); padding: 0; text-decoration: underline; font-size: 14px; }
  .trash { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 4px; }
  .trash .list li { display: block; cursor: default; padding: 8px 12px; }
  .trash .list li:hover { background: none; }
  .trash .actions { display: flex; gap: 6px; margin-top: 6px; }
  .trash .note { color: var(--muted); font-size: 13px; padding: 0 12px; margin: 2px 0 0; }
  .visit .meta .acts { display: flex; gap: 10px; align-items: center; flex: 0 0 auto; }
  details.trash > .visit { background: var(--bg); }
  .visit .meta .left { color: var(--danger); font-weight: 600; }
  .pass { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 12px 0 0; }
  .pass > .row > div { flex: 1; }
  .pass .amount { font-size: 20px; font-weight: 700; color: var(--muted); margin-left: 6px; }
  .pass .amount.has { color: var(--accent); }
  .pass .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .pass .pass-form { margin-top: 10px; }
  .pass details { border-top: 1px solid var(--line); margin-top: 8px; }
  .pass-row { display: grid; grid-template-columns: 140px 48px 110px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; font-size: 14px; border-top: 1px solid var(--bg); }
  .pass-row .when { color: var(--muted); }
  .pass-row .kind { font-size: 12px; text-align: center; padding: 2px 0; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .pass-row .won { font-weight: 700; text-align: right; }
  .pass-row .won.charge { color: var(--ok); }
  .pass-row .won.use { color: var(--danger); }
  .pass-row .memo { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.pass { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1 id="home">헤어원네스트 상담 카드</h1>
  <small>V1 · 이 컴퓨터 브라우저에만 저장됩니다 · 퇴근 때 [파일로 저장]</small>
  <div class="tools">
    <button type="button" class="secondary small" id="export">파일로 저장</button>
    <button type="button" class="secondary small" id="import">파일에서 불러오기</button>
    <input type="file" id="import-file" accept="application/json" hidden>
  </div>
</header>
<main>
  <aside>
    <input type="text" id="search" placeholder="고객 이름 또는 뒤 4자리로 찾기" autocomplete="off">
    <ul class="list" id="customer-list"></ul>
    <details id="new-customer">
      <summary>+ 새 고객 만들기</summary>
      <form class="newform" id="new-customer-form">
        <input type="text" id="new-name" placeholder="이름 (필수)" autocomplete="off">
        <input type="text" id="new-phone" placeholder="전화번호 (예: 010-1234-5678)" inputmode="tel" autocomplete="off">
        <input type="text" id="new-referrer" placeholder="소개해 준 분 (없으면 비움)" autocomplete="off">
        <button type="submit">만들기</button>
        <div class="msg" id="new-msg"></div>
      </form>
    </details>
    <div id="trash"></div>
  </aside>
  <section id="card"></section>
</main>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
